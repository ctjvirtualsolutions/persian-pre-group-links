<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A multilingual meeting-message hub for the Persian pre-group.">
    <title>Persian Pre-Group Meeting Messages</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="shell hero">
        <p class="eyebrow">Persian Pre-Group</p>
        <h1 id="site-title">Meeting Messages</h1>
        <p id="site-subtitle" class="intro">Loading meeting details…</p>
      </div>
    </header>

    <main class="shell">
      <figure id="main-image-wrap" class="main-image-wrap" hidden>
        <img id="main-image" class="main-image" alt="">
      </figure>

      <section id="language-cards" class="card-grid" aria-live="polite"></section>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    </main>

    <footer class="site-footer">
      <div class="shell">
        <p><a href="admin.html">Admin</a></p>
      </div>
    </footer>

    <template id="language-card-template">
      <article class="language-card">
        <p class="language-name"></p>
        <h2 class="message-heading"></h2>
        <dl class="message-details"></dl>
        <div class="button-row">
          <button class="button copy-button" type="button">Copy</button>
          <a class="button whatsapp-button" target="_blank" rel="noopener">WhatsApp</a>
          <a class="button sms-button">SMS</a>
          <a class="button email-button">Email</a>
        </div>
      </article>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>
