<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A multilingual meeting-message hub for the Persian pre-group.">
    <title>Persian Pre-Group Meeting Messages</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="shell hero">
        <p class="eyebrow">Persian Pre-Group</p>
        <h1 id="site-title">Meeting Messages</h1>
        <p id="site-intro" class="intro">Loading meeting details…</p>
      </div>
    </header>

    <main class="shell">
      <section id="meeting-summary" class="summary-card" aria-live="polite"></section>
      <section id="language-cards" class="card-grid" aria-live="polite"></section>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    </main>

    <footer class="site-footer">
      <div class="shell">
        <p>Update future meeting details in <code>config.json</code>.</p>
      </div>
    </footer>

    <template id="language-card-template">
      <article class="language-card">
        <div class="card-heading-row">
          <div>
            <p class="language-name"></p>
            <h2 class="message-heading"></h2>
          </div>
        </div>
        <p class="message-text"></p>
        <dl class="message-details"></dl>
        <div class="button-row">
          <button class="button copy-button" type="button"></button>
          <a class="button whatsapp-button" target="_blank" rel="noopener"></a>
          <a class="button sms-button"></a>
          <a class="button email-button"></a>
          <button class="button share-button" type="button"></button>
        </div>
      </article>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
